[env:ttgo-t1]
platform = espressif32
board = ttgo-t1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_ldf_mode = deep
lib_deps = codewitch-honey-crisis/htcw_esp_panel
    codewitch-honey-crisis/htcw_ttgo_power
    codewitch-honey-crisis/htcw_multibutton
    codewitch-honey-crisis/htcw_uix
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
			-DTTGO_T1
	        -DLV_CONF_INCLUDE_SIMPLE
upload_port = COM23
monitor_port = COM23